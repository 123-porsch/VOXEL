<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Chat Groq Autónomo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; background: #1e1e1e; color: #fff; }
        #chatbox { height: 400px; border: 1px solid #444; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #2d2d2d; border-radius: 8px; }
        .user { color: #4af; margin-bottom: 5px; text-align: right; }
        .ai { color: #5c5; margin-bottom: 15px; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button { padding: 10px 20px; background: #07c; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0059b3; }
    </style>
</head>
<body>

    <h2>Chat IA en la Nube (Groq)</h2>

    <div id="chatbox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        let historialMensajes = [];

        // 1. GENERA UNA LLAVE NUEVA EN GROQ Y PÉGALA AQUÍ ADENTRO (NO LA COMPARTAS EN EL CHAT)
        const apiKey = "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"; 

        async function enviarMensaje() {
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            const mensaje = input.value.trim();
            
            if (!mensaje) return;

            chatbox.innerHTML += `<div class="user"><b>Tú:</b> ${mensaje}</div>`;
            input.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;

            historialMensajes.push({ role: 'user', content: mensaje });

            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai';
            aiDiv.innerHTML = `<b>IA:</b> Pensando...`;
            chatbox.appendChild(aiDiv);

            try {
                const response = await fetch('https://groq.com', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama3-8b-8192', 
                        messages: historialMensajes
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error del servidor: ${response.status}`);
                }

                const data = await response.json();
                const respuestaIA = data.choices[0].message.content;

                historialMensajes.push({ role: 'assistant', content: respuestaIA });
                aiDiv.innerHTML = `<b>IA:</b> ${respuestaIA}`;
            } catch (error) {
                aiDiv.innerHTML = `<b>IA:</b> Error de conexión. Revisa que tu clave fija sea nueva y válida.`;
                console.error(error);
            }
            
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>

</body>
</html>
