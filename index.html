<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Chat IA Definitivo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; background: #1e1e1e; color: #fff; }
        #chatbox { height: 400px; border: 1px solid #444; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #2d2d2d; border-radius: 8px; }
        .user { color: #4af; margin-bottom: 5px; text-align: right; }
        .ai { color: #5c5; margin-bottom: 15px; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button { padding: 10px 20px; background: #07c; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0059b3; }
        .key-container { margin-bottom: 15px; background: #333; padding: 10px; border-radius: 6px; border: 1px solid #555; }
    </style>
</head>
<body>

    <h2>Chat IA en la Nube (Hugging Face)</h2>

    <div class="key-container">
        <label>Pega tu Token de Hugging Face aquí:</label>
        <input type="password" id="apiKeyInput" placeholder="hf_..." style="width: 95%; padding: 8px; margin-top: 5px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;">
    </div>

    <div id="chatbox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        // Historial para mantener la memoria
        let historialConversacion = "";

        async function enviarMensaje() {
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            const keyInput = document.getElementById('apiKeyInput');
            
            const mensaje = input.value.trim();
            const apiKey = keyInput.value.trim();
            
            if (!mensaje) return;
            if (!apiKey) {
                alert("Por favor, pega tu token de Hugging Face primero en la caja de arriba.");
                return;
            }

            chatbox.innerHTML += `<div class="user"><b>Tú:</b> ${mensaje}</div>`;
            input.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;

            // Construimos la memoria en formato de texto continuo para este modelo
            historialConversacion += `User: ${mensaje}\nAI:`;

            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai';
            aiDiv.innerHTML = `<b>IA:</b> Pensando...`;
            chatbox.appendChild(aiDiv);

            try {
                // Usamos el modelo ultra rápido y compatible con web de Llama 3 en Hugging Face
                const response = await fetch('https://huggingface.co', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        inputs: historialConversacion,
                        parameters: { max_new_tokens: 250, return_full_text: false }
                    })
                });

                if (!response.ok) throw new Error(`Error ${response.status}`);

                const data = await response.json();
                
                // Procesamos la respuesta del texto generado
                let respuestaIA = data[0].generated_text.trim();
                
                // Limpieza por si el modelo repite etiquetas
                respuestaIA = respuestaIA.split("User:")[0].split("AI:")[0].trim();

                historialConversacion += ` ${respuestaIA}\n`;
                aiDiv.innerHTML = `<b>IA:</b> ${respuestaIA}`;
            } catch (error) {
                aiDiv.innerHTML = `<b>IA:</b> Error al conectar con Hugging Face. Revisa que tu token sea correcto.`;
                console.error(error);
            }
            
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>

</body>
</html>
